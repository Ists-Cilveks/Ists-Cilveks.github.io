<!DOCTYPE html>
<html>
  <head>
    <title>Unnatural calculator</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="/css/style.css" rel="stylesheet">
    <style>
      input {
        background-color: var(--hc-bg);
        color: var(--main-color);
        font-size: 100%;
        width: 8em;
        padding: 0.1em;
      }
      .output {
        outline: 2px solid var(--secondary-bg-color);
        background-color: var(--hc-bg);
        padding-left: 0.07em;
        padding-right: 0.07em;
        line-break: anywhere;
      }
    </style>
  </head>
  <body class="main-content">
    <script src="/js/Color.js"></script>
    <script src="/css/palettize.js"></script>
    <script src="/js/particles.js"></script>
    <script src="/js/SVGRequests.js"></script>
    
    <a class="basic-btn home-btn" href="/" lang="en">home</a>
    <a class="basic-btn home-btn" href="/index.html?l=lv" lang="lv">uz sākumu</a>
    <a class="basic-btn home-btn ll" href="/index.html?l=tok" style="font-size: 250%;" lang="tok">lipu-open</a>
    
    <header id="main-header">
      <h1 lang="en">Unnatural calculator</h1>
    </header>
		<script src="/js/themes.js"></script>
    <script src="/js/languages.js" data-page-languages="en"></script>
    
    <p>
      <input type="number" name="in1" id="in1" onkeyup="myCalcContainer.update()" onkeypress="myCalcContainer.update()" onchange="myCalcContainer.update()" min="0" value="1">
      ··
      <input type="number" name="in2" id="in2" onkeyup="myCalcContainer.update()" onkeypress="myCalcContainer.update()" onchange="myCalcContainer.update()" min="0" value="1.61803398875">
      =
      <span class="output" id="out0"></span>
    </p>
    <p style="font-size: 130%;">
      <span class="output" id="out1"></span>
      ··
      <span class="output" id="out2"></span>
      =
      <span class="output" id="out3"></span>
    </p>
    
    <script src="unnatural.js"></script>
    <script>
      class CalcContainer {
        constructor(input1, input2, output0, output1, output2, output3) {
          this.input1 = input1
          this.input2 = input2
          this.output0 = output0
          this.output1 = output1
          this.output2 = output2
          this.output3 = output3
        }

        readInputs() {
          this.v1 = Number(this.input1.value)
          this.v2 = Number(this.input2.value)
        }

        

        update() {
          this.readInputs()
          this.res = phi**(Math.log(this.v1)*Math.log(this.v2)/logphi/logphi)
          this.output0.innerHTML = this.res
          Unnatural.writeUnnaturalToOutput(this.output1, this.v1)
          Unnatural.writeUnnaturalToOutput(this.output2, this.v2)
          Unnatural.writeUnnaturalToOutput(this.output3, this.res)
        }
      }

      let elements = ["in1", "in2", "out0", "out1", "out2", "out3"].map((a)=>document.getElementById(a))
      let myCalcContainer = new CalcContainer(...elements)
      myCalcContainer.update()

      insertSVG("images/unnatural font.svg", undefined, function(){
        myCalcContainer.update()
      })

    </script>
    
  </body>
</html>

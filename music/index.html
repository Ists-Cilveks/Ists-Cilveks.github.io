<!DOCTYPE html>
<html>
  <head>
    <title>Music</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="/css/style.css" rel="stylesheet">
    <script src="https://unpkg.com/tone"></script>
  </head>
  <body class="main-content">
    <script src="/js/Color.js"></script>
    <script src="/css/palettize.js"></script>
    <script src="/js/particles.js"></script>
    <script src="/js/SVGRequests.js"></script>
    
    <a class="basic-btn home-btn" href="/" lang="en">home</a>
    <a class="basic-btn home-btn" href="/index.html?l=lv" lang="lv">uz sākumu</a>
    <a class="basic-btn home-btn ll" href="/index.html?l=tok" style="font-size: 250%;" lang="tok">lipu-open</a>
    
    <header id="main-header">
      <h1 lang="en">Music tests</h1>
    </header>
		<script src="/js/themeBtn.js"></script>
    <script src="/js/languages.js" my-languges="en"></script>
    
    <canvas id="music-canvas" height="100" width="400"></canvas><br>

    <script>
      const canvas = document.getElementById("music-canvas")
      const context = canvas.getContext("2d")

      const phi = (1+5**(1/2))/2
      const theta = phi**2
      const ona = phi**3
      const onaphi = phi**4
      const onathey = phi**5
      const epsi = phi**6

      var isPlaying = false
      var barlength = Tone.Time("1n")
      var beat = barlength/ona
      Tone.Transport.timeSignature = [4, 4]
      Tone.Transport.bpm.value = 80

      var channel = new Tone.Channel(volume=-8).toDestination()
      const bassSynthData = {
        "volume": -100,
        "detune": 0,
        // "portamento": 0.05,
        "portamento": 0,
        "envelope": {
          "attack": 0.05,
          "attackCurve": "exponential",
          "decay": 0.2,
          "decayCurve": "linear",
          "release": 0.3,
          "releaseCurve": "linear",
          "sustain": 0.6
        },
        "oscillator": {
          "partialCount": 0,
          "partials": [],
          "phase": 0,
          "type": "amtriangle",
          "harmonicity": 2,
          "modulationType": "sine"
        }
      }
      const arpSynthData = {
        "volume": -4,
        "detune": 0,
        "portamento": 0,
        "envelope": {
          "attack": 0.05,
          "attackCurve": "exponential",
          "decay": 0.2,
          "decayCurve": "linear",
          "release": 0.3,
          "releaseCurve": "linear",
          "sustain": 0.6
        },
        "oscillator": {
          "partialCount": 0,
          "partials": [],
          "phase": 0,
          "type": "amtriangle",
          "harmonicity": 0,
          "modulationType": "sine"
        }
      }
      const bassSynth = new Tone.Synth(bassSynthData)
      bassSynth.toDestination()
      // const distortion = new Tone.Distortion(0.2);
      // bassSynth.chain(distortion, channel)
      // const lowpass = new Tone.Filter(1500);
      // bassSynth.chain(lowpass, Tone.Destination)
      const melodySynth = new Tone.Synth(arpSynthData).connect(channel)
      let seqFunc = (synth) => {
        return (time, note) => {
          if (note == "~") return
          if (note == ".") {
            synth.triggerRelease(time)
            return
          }
          synth.triggerAttack(note, time);
        }
      }
      const hatSampler = new Tone.Player("samples/closed-hat1.wav").toDestination();
      const drumSampler = new Tone.Sampler({
        urls: {
          A1: 'clap1.wav',
          A2: 'closed-hat1.wav',
          A3: 'snare1.wav',
          A4: 'kick1.wav',
        },
        baseUrl: 'samples/',
        release: 1
      }).toDestination()
      function toneFunc(time, events) {
        for (const event of events) {
          event.start(time)
        }
      }

      // const bassline = new Tone.Sequence(seqFunc(bassSynth), [
      //   ["C3","~",".","D3","~","~",".","."],
      //   ["F3","~",".","G3","~","A3","G3","F3"],
      //   ["D3","~",".","F3","~",["~","."],"F3","~"],
      //   ["G3","~","C4","A3","~","G3","F3","G3"],
      // ], barlength)

      let lastFibWord = [true]
      let fibWord = [true, false]
      for (let i = 0; i < 11; i++) {
        let newFibWord = fibWord.concat(lastFibWord)
        lastFibWord = fibWord
        fibWord = newFibWord
      }
      let beatTimes = [0]
      let newBeatTime = 0
      let basslineValues = []
      let bassCounterSmall = 0
      let bassCounterBig = 0
      let drumValues = []
      let drumCounterSmall = 0
      let drumCounterBig = 0
      let hatValues = []
      for (let i = 0; i < fibWord.length; i++) {
        let bassLength = fibWord[bassCounterBig] ? 5 : 3
        if (bassCounterSmall >= bassLength) {
          bassCounterBig++
          bassCounterSmall = 0
        }
        let bassNote = fibWord[bassCounterBig] ? ["A3","B3","C4","D4","C4"][bassCounterSmall] : ["G3","A3","~"][bassCounterSmall]
        basslineValues.push([newBeatTime, bassNote])
        bassCounterSmall++

        let drumLength = fibWord[drumCounterBig] ? 13 : 8
        if (drumCounterSmall >= drumLength) {
          drumCounterBig++
          drumCounterSmall = 0
        }
        let drumNote = fibWord[drumCounterBig] ? ["A4", ".", ".", "A3", ".", "A4", ".", ".", "A4", ".", "A3", ".", "."][drumCounterSmall] : ["A1", ".", ".", "A1", "A4", "A1", "A1", "A1"][drumCounterSmall]
        drumValues.push([newBeatTime/theta, drumNote])
        drumCounterSmall++

        hatValues.push([newBeatTime/phi, "A2"])
        
        beatTimes.push(newBeatTime)
        const is_long = fibWord[i]
        let l = beat
        if (!is_long) { l/=phi }
        newBeatTime += l
      }
      basslineValues.push([newBeatTime, "."])

      const bassline = new Tone.Part(seqFunc(bassSynth), basslineValues)
      const drums = new Tone.Part(seqFunc(drumSampler), drumValues)
      const hats = new Tone.Part(function(time) {hatSampler.start(time)}, hatValues)
      // const bassline = new Tone.Part(((time, note) => {
      //   // the notes given as the second element in the array
      //   // will be passed in as the second argument
      //   bassSynth.triggerAttackRelease(note, "8n", time);
      // }), [[0, "C2"], ["0:2", "C3"], ["0:3:2", "G2"]])
      

      // // const melody = new Tone.Sequence(seqFunc(melodySynth), [["F4","~","~","G4"],["E4",["F4","."]]], barlength/2).start(0)
      // const arpeggio = new Tone.Sequence(seqFunc(melodySynth), [
      //   [
      //     "E5","F5","G5","E5","F5","G5",
      //     "E5","G5","A5","E5","G5","A5","E5","G5","A5","G5",
      //   ],
      //   [
      //     "E5","G5","A5","E5","G5","A5",
      //     "F5","G5","C6","F5","G5","C6","F5","G5","C6","G5",
      //   ],
      // ], barlength)
      
      // new Tone.ToneEvent(toneFunc, [bassline, arpeggio]).start(0)
      new Tone.ToneEvent(toneFunc, [bassline, drums, hats]).start(0)
      
      function time_to_x(t) { return 50+t*50 }
      function draw() {
        context.clearRect(0,0,canvas.width,canvas.height)
        context.fillStyle = "white"
        context.fillRect(time_to_x(0), 0, 3, 100)
        context.fillStyle = "green"
        const now = Tone.Transport.seconds-1 // FIXME: what's this magic constant?
        for (let i = 0; i < basslineValues.length-1; i++) {
          const pair = basslineValues[i];
          const nextPair = basslineValues[i+1];

          let time = pair[0] - now
          let note = pair[1]
          let endTime = nextPair[0] - now
          let noteIndex = {"G3": -1, "A3": 0, "B3": 1, "C4": 2, "D4": 3}[note]
          
          context.fillRect(time_to_x(time), 50-10*noteIndex, time_to_x(endTime)-time_to_x(time), 10)
        }
        context.fillStyle = "gray"
        for (let i = 0; i < drumValues.length; i++) {
          const pair = drumValues[i];
          
          let time = pair[0] - now
          let note = pair[1]
          let noteIndex = {"A1": -1, "A2": 0, "A3": 1, "A4": 2, "A5": 3}[note]
          
          context.fillRect(time_to_x(time), 70-10*noteIndex, 3, 10)
        }
        context.fillStyle = "white"
        for (let i = 0; i < hatValues.length; i++) {
          const pair = hatValues[i];
          let time = pair[0] - now
          context.fillRect(time_to_x(time), 95, 2, 3)
        }
        
        if (isPlaying) {
          window.requestAnimationFrame(draw)
        }
      }

      function playAudio() {
        isPlaying = true
        Tone.Transport.start();
        draw()
			}
      function pauseAudio() {
        isPlaying = false
        bassSynth.triggerRelease("+0.1")
        melodySynth.triggerRelease("+0.1")
        Tone.Transport.stop();
      }
    </script>
    
    <button class="basic-btn" onclick="isPlaying ? pauseAudio() : playAudio()">Play/Pause</button>
  </body>
</html>

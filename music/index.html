<!DOCTYPE html>
<html>
  <head>
    <title>Music</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="/css/style.css" rel="stylesheet">
    <script src="https://unpkg.com/tone"></script>
    <style>
      .container {
        overflow-x: scroll;
        overflow-y: hidden;
        width: 660px;
        height: 110px;
        white-space: nowrap;
        margin: 10px;
      }

      .keyboard {
        width: auto;
        padding: 0;
        margin: 0;
      }

      .key {
        cursor: pointer;
        font:
          16px "Open Sans",
          "Lucida Grande",
          "Arial",
          sans-serif;
        border: 1px solid black;
        border-radius: 5px;
        width: 20px;
        height: 80px;
        text-align: center;
        box-shadow: 2px 2px darkgray;
        display: inline-block;
        position: relative;
        margin-right: 3px;
        user-select: none;
        -moz-user-select: none;
        -webkit-user-select: none;
        -ms-user-select: none;
      }

      .key div {
        position: absolute;
        bottom: 0;
        text-align: center;
        width: 100%;
        pointer-events: none;
      }

      .key div sub {
        font-size: 10px;
        pointer-events: none;
      }

      .key:hover {
        background-color: #eeeeff;
      }

      .key:active,
      .active {
        background-color: black;
        color: white;
      }

      .octave {
        display: inline-block;
        padding-right: 6px;
      }

      .settingsBar {
        padding-top: 8px;
        font:
          14px "Open Sans",
          "Lucida Grande",
          "Arial",
          sans-serif;
        position: relative;
        vertical-align: middle;
        width: 100%;
        height: 30px;
      }

      .left {
        width: 50%;
        position: absolute;
        left: 0;
        display: table-cell;
        vertical-align: middle;
      }

      .left span,
      .left input {
        vertical-align: middle;
      }

      .right {
        width: 50%;
        position: absolute;
        right: 0;
        display: table-cell;
        vertical-align: middle;
      }

      .right span {
        vertical-align: middle;
      }

      .right input {
        vertical-align: baseline;
      }

    </style>
  </head>
  <body class="main-content">
    <script src="/js/Color.js"></script>
    <script src="/css/palettize.js"></script>
    <script src="/js/particles.js"></script>
    <script src="/js/SVGRequests.js"></script>
    
    <a class="basic-btn home-btn" href="/" lang="en">home</a>
    <a class="basic-btn home-btn" href="/index.html?l=lv" lang="lv">uz sākumu</a>
    <a class="basic-btn home-btn ll" href="/index.html?l=tok" style="font-size: 250%;" lang="tok">lipu-open</a>
    
    <header id="main-header">
      <h1 lang="en">Music tests</h1>
    </header>
		<script src="/js/themeBtn.js"></script>
    <script src="/js/languages.js" my-languges="en"></script>
    
    <canvas id="music-canvas" height="100" width="600"></canvas><br>

    <div class="container">
      <div class="keyboard"></div>
    </div>
    <div class="settingsBar">
      <div class="left">
        <span>Volume: </span>
        <input
          type="range"
          min="0.0"
          max="1.0"
          step="0.01"
          value="0.5"
          list="volumes"
          name="volume" />
        <datalist id="volumes">
          <option value="0.0" label="Mute"></option>
          <option value="1.0" label="100%"></option>
        </datalist>
      </div>
      <div class="right">
        <span>Current waveform: </span>
        <select name="waveform">
          <option value="sine">Sine</option>
          <option value="square" selected>Square</option>
          <option value="sawtooth">Sawtooth</option>
          <option value="triangle">Triangle</option>
          <option value="custom">Custom</option>
        </select>
      </div>
    </div>

    <script>
      const canvas = document.getElementById("music-canvas")
      const context = canvas.getContext("2d")

      const phi = (1+5**(1/2))/2
      const theta = phi**2
      const ona = phi**3
      const onaphi = phi**4
      const onathey = phi**5
      const epsi = phi**6

      var isPlaying = false
      var barlength = Tone.Time("1n")
      var beatLength = barlength/ona
      Tone.Transport.timeSignature = [4, 4]
      Tone.Transport.bpm.value = 80

      var channel = new Tone.Channel(volume=-8).toDestination()
      const bassSynthData = {
        "volume": -100,
        "detune": 0,
        // "portamento": 0.05,
        "portamento": 0,
        "envelope": {
          "attack": 0.05,
          "attackCurve": "exponential",
          "decay": 0.2,
          "decayCurve": "linear",
          "release": 0.3,
          "releaseCurve": "linear",
          "sustain": 0.6
        },
        "oscillator": {
          "partialCount": 0,
          "partials": [],
          "phase": 0,
          "type": "amtriangle",
          "harmonicity": 2,
          "modulationType": "sine"
        }
      }
      const arpSynthData = {
        "volume": -4,
        "detune": 0,
        "portamento": 0,
        "envelope": {
          "attack": 0.05,
          "attackCurve": "exponential",
          "decay": 0.2,
          "decayCurve": "linear",
          "release": 0.3,
          "releaseCurve": "linear",
          "sustain": 0.6
        },
        "oscillator": {
          "partialCount": 0,
          "partials": [],
          "phase": 0,
          "type": "amtriangle",
          "harmonicity": 0,
          "modulationType": "sine"
        }
      }
      const bassSynth = new Tone.Synth(bassSynthData)
      bassSynth.toDestination()
      // const distortion = new Tone.Distortion(0.2);
      // bassSynth.chain(distortion, channel)
      // const lowpass = new Tone.Filter(1500);
      // bassSynth.chain(lowpass, Tone.Destination)
      const melodySynth = new Tone.Synth(arpSynthData).connect(channel)
      let seqFunc = (synth) => {
        return (time, note) => {
          if (note == "~") return
          if (note == ".") {
            synth.triggerRelease(time)
            return
          }
          synth.triggerAttack(note, time);
        }
      }

      // Synth from https://developer.mozilla.org/en-US/docs/Web/API/Web_Audio_API/Simple_synth
      const audioContext = new AudioContext();
      const oscList = [];
      let mainGainNode = null;
      const keyboard = document.querySelector(".keyboard");
      const wavePicker = document.querySelector("select[name='waveform']");
      const volumeControl = document.querySelector("input[name='volume']");
      let customWaveform = null;
      let sineTerms = null;
      let cosineTerms = null;
      function createNoteTable() {
        const noteFreq = [
          { A: 27.5, "A#": 29.13523509488062, B: 30.867706328507754 },
          {
            C: 32.70319566257483,
            "C#": 34.64782887210901,
            D: 36.70809598967595,
            "D#": 38.89087296526011,
            E: 41.20344461410874,
            F: 43.65352892912549,
            "F#": 46.2493028389543,
            G: 48.99942949771866,
            "G#": 51.91308719749314,
            A: 55,
            "A#": 58.27047018976124,
            B: 61.73541265701551,
          },
        ];
        for (let octave = 2; octave <= 7; octave++) {
          noteFreq.push(
            Object.fromEntries(
              Object.entries(noteFreq[octave - 1]).map(([key, freq]) => [
                key,
                freq * 2,
              ]),
            ),
          );
        }
        noteFreq.push({ C: 4186.009044809578 });
        return noteFreq;
      }
      function setup() {
        const noteFreq = createNoteTable();

        volumeControl.addEventListener("change", changeVolume);

        mainGainNode = audioContext.createGain();
        mainGainNode.connect(audioContext.destination);
        mainGainNode.gain.value = volumeControl.value;

        // Create the keys; skip any that are sharp or flat; for
        // our purposes we don't need them. Each octave is inserted
        // into a <div> of class "octave".

        noteFreq.forEach((keys, idx) => {
          const keyList = Object.entries(keys);
          const octaveElem = document.createElement("div");
          octaveElem.className = "octave";

          keyList.forEach((key) => {
            if (key[0].length === 1) {
              octaveElem.appendChild(createKey(key[0], idx, key[1]));
            }
          });

          keyboard.appendChild(octaveElem);
        });

        document
          .querySelector("div[data-note='B'][data-octave='5']")
          .scrollIntoView(false);

        sineTerms = new Float32Array([0, 0, 1, 0, 1]);
        cosineTerms = new Float32Array(sineTerms.length);
        customWaveform = audioContext.createPeriodicWave(cosineTerms, sineTerms);

        for (let i = 0; i < 9; i++) {
          oscList[i] = {};
        }
      }

      setup();
      function createKey(note, octave, freq) {
        const keyElement = document.createElement("div");
        const labelElement = document.createElement("div");

        keyElement.className = "key";
        keyElement.dataset["octave"] = octave;
        keyElement.dataset["note"] = note;
        keyElement.dataset["frequency"] = freq;
        labelElement.appendChild(document.createTextNode(note));
        labelElement.appendChild(document.createElement("sub")).textContent = octave;
        keyElement.appendChild(labelElement);

        keyElement.addEventListener("mousedown", notePressed);
        keyElement.addEventListener("mouseup", noteReleased);
        keyElement.addEventListener("mouseover", notePressed);
        keyElement.addEventListener("mouseleave", noteReleased);

        return keyElement;
      }
      function playTone(freq) {
        const osc = audioContext.createOscillator();
        osc.connect(mainGainNode);

        const type = wavePicker.options[wavePicker.selectedIndex].value;

        if (type === "custom") {
          osc.setPeriodicWave(customWaveform);
        } else {
          osc.type = type;
        }

        osc.frequency.value = freq;
        osc.start();

        return osc;
      }
      function notePressed(event) {
        if (event.buttons & 1) {
          const dataset = event.target.dataset;

          if (!dataset["pressed"] && dataset["octave"]) {
            const octave = Number(dataset["octave"]);
            oscList[octave][dataset["note"]] = playTone(dataset["frequency"]);
            dataset["pressed"] = "yes";
          }
        }
      }
      function noteReleased(event) {
        const dataset = event.target.dataset;

        if (dataset && dataset["pressed"]) {
          const octave = Number(dataset["octave"]);

          if (oscList[octave] && oscList[octave][dataset["note"]]) {
            oscList[octave][dataset["note"]].stop();
            delete oscList[octave][dataset["note"]];
            delete dataset["pressed"];
          }
        }
      }
      function changeVolume(event) {
        mainGainNode.gain.value = volumeControl.value;
      }
      const synthKeys = document.querySelectorAll(".key");
      // prettier-ignore
      const keyCodes = [
        "Space",
        "ShiftLeft", "KeyZ", "KeyX", "KeyC", "KeyV", "KeyB", "KeyN", "KeyM", "Comma", "Period", "Slash", "ShiftRight",
        "KeyA", "KeyS", "KeyD", "KeyF", "KeyG", "KeyH", "KeyJ", "KeyK", "KeyL", "Semicolon", "Quote", "Enter",
        "Tab", "KeyQ", "KeyW", "KeyE", "KeyR", "KeyT", "KeyY", "KeyU", "KeyI", "KeyO", "KeyP", "BracketLeft", "BracketRight",
        "Digit1", "Digit2", "Digit3", "Digit4", "Digit5", "Digit6", "Digit7", "Digit8", "Digit9", "Digit0", "Minus", "Equal", "Backspace",
        "Escape",
      ];
      function keyNote(event) {
        const elKey = synthKeys[keyCodes.indexOf(event.code)];
        if (elKey) {
          if (event.type === "keydown") {
            elKey.tabIndex = -1;
            elKey.focus();
            elKey.classList.add("active");
            notePressed({ buttons: 1, target: elKey });
          } else {
            elKey.classList.remove("active");
            noteReleased({ buttons: 1, target: elKey });
          }
          event.preventDefault();
        }
      }
      addEventListener("keydown", keyNote);
      addEventListener("keyup", keyNote);



      maxUsedTimelineY = 0
      class TimelineArtist {
        constructor(color="gray", y, height=3) {
          this.color = color
          if (y != undefined) { this.y = y }
          else {
            maxUsedTimelineY += 7
            this.y = maxUsedTimelineY
          }
          this.height = height
        }

        draw(values, now) {
          context.fillStyle = this.color
          for (let i = 0; i < values.length; i++) {
            const pair = values[i];
            let time = pair[0] - now
            context.fillRect(time_to_x(time), this.y, 2, this.height)
          }
        }
      }

      class SampleTrack {
        constructor(sampleName, longString, shortString, longBeatLength=1/theta, artist=new TimelineArtist()) {
          this.sampler = new Tone.Player("samples/"+sampleName+".wav").toDestination()
          this.shortString = shortString
          this.longString = longString
          this.time = 0
          this.partIndex = 0
          this.longBeatLength = longBeatLength
          this.storedValues = []
          this.artist = artist
        }

        addNextPart() {
          const string = fibWord[this.partIndex] ? this.longString : this.shortString
          let partValues = []
          for (let beat = 0; beat < string.length; beat++) {
            let symbol = string[beat]
            if (symbol != ".") {
              partValues.push([this.time, symbol])
              this.storedValues.push([this.time, symbol])
            }
            let beatLength = barlength * this.longBeatLength
            if (!fibWord[beat]) { beatLength/=phi }
            this.time += beatLength
          }
          let sampler = this.sampler
          const part = new Tone.Part(function(time) {sampler.start(time)}, partValues)
          new Tone.ToneEvent(toneFunc, [part]).start(0)
          this.partIndex++
        }
        addUntilTime(time) {
          while (this.time < time) {
            this.addNextPart()
          }
        }
        draw(now) {
          this.artist.draw(this.storedValues, now)
        }
      }

      const samplers = {
        'hat': new SampleTrack("closed-hat1", "#.", "#", 1/onathey, new TimelineArtist("white")),
        'clap': new SampleTrack("clap1", ".............", "#..#.###", 1/onathey, new TimelineArtist("#da4", 30, 7)),
        'snare': new SampleTrack("snare1", "..#...#.", "..#..", 1/onaphi),
        'kick': new SampleTrack("kick1", "#.", ".", 1/onaphi),
      }
      let sampleSeqFunc = (synth) => {
        return (time, note) => {
          if (note == "~") return
          if (note == ".") {
            synth.triggerRelease(time)
            return
          }
          synth.triggerAttack(note, time);
        }
      }
      
      function toneFunc(time, events) {
        for (const event of events) {
          event.start(time)
        }
      }

      // const bassline = new Tone.Sequence(seqFunc(bassSynth), [
      //   ["C3","~",".","D3","~","~",".","."],
      //   ["F3","~",".","G3","~","A3","G3","F3"],
      //   ["D3","~",".","F3","~",["~","."],"F3","~"],
      //   ["G3","~","C4","A3","~","G3","F3","G3"],
      // ], barlength)

      let lastFibWord = [true]
      let fibWord = [true, false]
      for (let i = 0; i < 11; i++) {
        let newFibWord = fibWord.concat(lastFibWord)
        lastFibWord = fibWord
        fibWord = newFibWord
      }
      let beatTimes = [0]
      let newBeatTime = 0
      let basslineValues = []
      let bassCounterSmall = 0
      let bassCounterBig = 0
      for (let i = 0; i < fibWord.length; i++) {
        let bassLength = fibWord[bassCounterBig] ? 5 : 3
        if (bassCounterSmall >= bassLength) {
          bassCounterBig++
          bassCounterSmall = 0
        }
        let bassNote = fibWord[bassCounterBig] ? ["A3","B3","C4","D4","C4"][bassCounterSmall] : ["G3","A3","~"][bassCounterSmall]
        basslineValues.push([newBeatTime, bassNote])
        bassCounterSmall++
        
        beatTimes.push(newBeatTime)
        const is_long = fibWord[i]
        let l = beatLength
        if (!is_long) { l/=phi }
        newBeatTime += l
      }
      basslineValues.push([newBeatTime, "."])

      const bassline = new Tone.Part(seqFunc(bassSynth), basslineValues)

      for (const name in samplers) {
        samplers[name].addUntilTime(30)
      }

      // new Tone.ToneEvent(toneFunc, [bassline, arpeggio]).start(0)
      new Tone.ToneEvent(toneFunc, [bassline]).start(0)
      
      function time_to_x(t) { return 50+t*50 }
      function draw() {
        context.clearRect(0, 0, canvas.width, canvas.height)
        context.fillStyle = "white"
        context.fillRect(time_to_x(0), 0, 3, 100)
        const now = Tone.Transport.seconds-1 // FIXME: what's this magic constant?

        // context.fillStyle = "green"
        // for (let i = 0; i < basslineValues.length-1; i++) {
        //   const pair = basslineValues[i];
        //   const nextPair = basslineValues[i+1];

        //   let time = pair[0] - now
        //   let note = pair[1]
        //   let endTime = nextPair[0] - now
        //   let noteIndex = {"G3": -1, "A3": 0, "B3": 1, "C4": 2, "D4": 3}[note]
          
        //   context.fillRect(time_to_x(time), 50-10*noteIndex, time_to_x(endTime)-time_to_x(time), 10)
        // }

        for (const name in samplers) {
          samplers[name].draw(now)
        }
        
        if (isPlaying) {
          window.requestAnimationFrame(draw)
        }
      }

      draw()

      function playAudio() {
        isPlaying = true
        Tone.Transport.start();
        draw()
			}
      function pauseAudio() {
        isPlaying = false
        bassSynth.triggerRelease("+0.1")
        melodySynth.triggerRelease("+0.1")
        Tone.Transport.stop();
      }
    </script>
    
    <button class="basic-btn" onclick="isPlaying ? pauseAudio() : playAudio()">Play/Pause</button>
  </body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title></title>
    <style media="screen">
      body{
        background-color: rgb(5, 40, 47);
        background-color: rgb(0, 0, 0);
        color: rgb(150, 150, 150);
        font-size: 40px;
        overflow: hidden;
      }
      canvas{
        outline: 2px dashed black;
        position: absolute;
        left: 0;
        top: 0;
      }

    </style>
  </head>
  <body>
    <canvas id="canvas" width="300" height="300"></canvas>
    <script type="text/javascript">
      function rand(maximum) {
        max=maximum | 1;
        return Math.random()*max;
      }
      function randint(max) {
        return Math.floor(Math.random()*max);
      }
      function clamp(num, val) {
        var v=val | 1;
        return 1-(v/(num+v));
      }
      function atan4(x1, y1, x2, y2) {
        return Math.atan2(y2-y1, x2-x1) * 180 / Math.PI;
      }
      function dsin(val) {
        return Math.sin((val/360)*Math.PI*2);
      }
      function dcos(val) {
        return Math.cos((val/360)*Math.PI*2);
      }
      function linpos(val) {
        if(val<0){
          return 0;
        }
        else {
          return val;
        }
      }

      var height=window.innerHeight;
      var width=window.innerWidth;
      var canvassize=(height+width)/2;
      var canvas=document.getElementById("canvas");
      canvas.width=width;
      canvas.height=height;
      var context=canvas.getContext("2d");
      var branatt=0;
      //var droop= 0 ;
      var n= 0 ;


      ////////////////////////////////////////////////////////////
      ////////////////////////////////////////////////////////////
      ////////////////////////////////////////////////////////////
      function Color(r,g,b) {
        this.r=Math.floor(r);
        this.g=Math.floor(g);
        this.b=Math.floor(b);
        this.givergb= function(){
          return "rgb("+this.r+","+this.g+","+this.b+")";
        }
      }
      /*function Bulb(x,y,col,size) {
        this.x=x;
        this.y=y;
        this.col=col;
        this.size=size;
        this.draw=function (cont) {
          cont.fillStyle=this.col.givergb();
          cont.fillRect(this.x-(this.size/2), this.y-(this.size/2), this.size, this.size);
          cont.fillStyle="rgb(150,130,30)";
          cont.fillRect(this.x-(this.size/3), this.y-(this.size/4*3), this.size/3*2, this.size/3 );
        }
      }*/
      function Branch(x, y, width, angle, level, length) {
        this.x=x;
        this.y=y;
        this.width=width;
        this.angle=angle;
        this.level=level;
        this.length=length;
        this.grown=false;
        this.endx=this.x+(dcos(this.angle)*this.length);
        this.endy=this.y-(dsin(this.angle)*this.length)/*+droop*/;
        //console.log(dsin(this.angle));
        this.endang=-atan4(this.x, this.y, this.endx, this.endy);
        this.grow=function () {
          this.grown=true;
          var retarr=[];
          var loccnt=0;
          if (this.level<5000) {
            retarr.push(new Branch(
              this.endx,
              this.endy,
              this.width,
              this.angle-10,
              this.level*2,
              this.length
            ));
            if ((this.level-1)/3%2==1&&this.level!=4) {
              retarr.push(new Branch(
                this.endx,
                this.endy,
                this.width,
                this.angle+10,
                (this.level-1)/3,
                this.length
              ));
            }
          }

          return retarr;
        }
      }

      function Tree() {
        //                         x, y, width, angle, level, length
        this.branches=[new Branch(
          window.innerWidth/3.5,
          window.innerHeight/1.15,
          10,
          150,
          1,
          canvassize/45
        )];

        //grow branches
        var done=false;
        while (!done) {
          done=true;
          for (var i = 0; i < this.branches.length; i++) {
            if ( (!this.branches[i].grown) && this.branches[i].width>0.05 && branatt<10000000) {
              done=false;
              var growarr=this.branches[i].grow();
              for (var br = 0; br < growarr.length; br++) {
                this.branches.push(growarr[br]);
              }
              branatt++;
            }
          }
        }
        console.log("Branch number: "+branatt);
      }

      var trees=[];




      function resized() {
        height=window.innerHeight;
        width=window.innerWidth;

        canvas.width=width;
        canvas.height=height;

        draw();
        /*context.fillStyle="rgb(10,50,30)";
        context.beginPath();
        context.moveTo(width/2,0);
        context.lineTo(width, window.innerHeight);
        context.lineTo(0, window.innerHeight);
        context.fill();*/
      }
      resized();

      ////////////////////////////////////////////////////////////
      ////////////////////////////////////////////////////////////
      ////////////////////////////////////////////////////////////
      function draw() {

        for (var i = 0; i < 1; i++) {
          trees[i]=new Tree();
        }

        for (var tr = 0; tr < trees.length; tr++) {
          for (var i = trees[tr].branches.length-1; i >= 0; i--) {
          //for (var i = 0; i < trees[tr].branches.length; i++) {
            var obj=trees[tr].branches[i];
            var loccnt=0;
            while (true) {
              if (obj.level%(2**loccnt)==0) {
                loccnt++;
              }
              else {
                break;
              }
            }
            /*if (obj.level%2==0) {
              context.strokeStyle="rgb(20,20,255)";
            }
            else {
              context.strokeStyle="rgb(20,255,20)";
            }*/
            context.strokeStyle="hsl("+loccnt*15+",100%,50%)";
            context.lineWidth=/*1/(obj.level+10)*50+obj.width*/obj.width;
            context.lineCap="round";
            context.beginPath();
            context.moveTo(obj.x, obj.y);
            context.lineTo(obj.endx, obj.endy);
            context.stroke();
          }
        }

      }

      window.addEventListener("click", function () {
        draw();
      });
      window.addEventListener("dblclick", function () {
        location.reload();
      });
      window.addEventListener("resize", function () {
        resized();
      });
    </script>
  </body>
</html>

      function Color(r, g, b) {
        if (g!=undefined) {//all colors defined, set as those
          this.r=r;
          this.g=g;
          this.b=b;
        }
        else {//one color defined, set to that gray
          this.r=r;
          this.g=r;
          this.b=r;
        }
        this.mult=function (c) {
          if (typeof c=="number") {
            return new Color(this.r*c, this.g*c, this.b*c);
          }
          else {
            return new Color(this.r*c.r, this.g*c.g, this.b*c.b);
          }
        }
        this.div=function(v) {
          return new Color(this.r/v, this.g/v, this.b/v);
        }
        this.add=function(v) {
          if (typeof v=="number") {
            return new Color(this.r+v, this.g+v, this.b+v);
          }
          else {
            return new Color(this.r+v.r, this.g+v.g, this.b+v.b);
          }
        }
      }
      var colpass=new Color();
      var colres=new Color();
      function Vec3(x=0, y=0, z=0) {
        if (typeof x=="number") {
          this.x=x;
          this.y=y;
          this.z=z;
        }
        else {
          this.x=x[0];
          this.y=x[1];
          this.z=x[2];
        }
        this.copy=function() {
          return new Vec3(this.x, this.y, this.z);
        }
        this.neg=function() {
          return new Vec3(-this.x, -this.y, -this.z);
        }
        this.sub=function(v) {
          return new Vec3(this.x-v.x, this.y-v.y, this.z-v.z);
        }
        this.add=function(v) {
          return new Vec3(this.x+v.x, this.y+v.y, this.z+v.z);
        }
        this.mult=function(sc) {
          return new Vec3(this.x*sc, this.y*sc, this.z*sc);
        }
        this.len=function() {
          return Math.sqrt(this.x**2+this.y**2+this.z**2);
        }
        this.unit=function(sc) {
          var len=this.len();
          return new Vec3(this.x/len, this.y/len, this.z/len);
        }
        this.div=function(sc) {
          return new Vec3(this.x/sc, this.y/sc, this.z/sc);
        }
        this.cross=function(v) {
          return new Vec3(this.y*v.z-this.z*v.y, -(this.x*v.z-this.z*v.x), this.x*v.y-this.y*v.x);
        }
        this.dot=function(v) {
          return this.x*v.x+this.y*v.y+this.z*v.z;
        }
      }
      function Material(color, light, gloss=0) {
        if (true) {//defining this.color
          if (typeof color=="number") {
            this.color=new Color(color, color, color);
          }
          else if (Array.isArray(color)) {
            this.color=new Color(color[0], color[1], color[2]);
          }
          else {
            this.color=color;
          }
        }
        if (true) {//defining this.light
          if (light==undefined) {
            this.light=new Color(this.color.r, this.color.g, this.color.b);
          }
          else if (typeof light=="number") {

          }
          else if (Array.isArray(light)) {

          }

      function stepcalc() {
        step=new Vec3(
          stepsize*Math.cos(anghor)*Math.cos(angver),
          stepsize*Math.sin(anghor)*Math.cos(angver),
          stepsize*Math.sin(angver)
        )
      }
      function draw() {
        for (var i = 0; i < usew; i++) {
          for (var j = 0; j < useh; j++) {
            var e=arr[i][j];
            context.fillStyle="rgb("+e[0]/e[3]*256+","+e[1]/e[3]*256+","+e[2]/e[3]*256+")";
            context.fillRect(i*pixsize,j*pixsize,pixsize,pixsize);
          }
        }
      }
      function update() {
        if (!paused) {
          if (true) {//controls
            if(k[87]){//w - forward
              startpos.x+=Math.cos(camang)/ 50 ;
              startpos.y+=Math.sin(camang)/ 50 ;
              clear();
            }
            if(k[65]){//a - left
              camang-=0.02;
              clear();
            }
            if(k[83]){//s - back
              startpos.x-=Math.cos(camang)/ 50 ;
              startpos.y-=Math.sin(camang)/ 50 ;
              clear();
            }
            if(k[68]){//d - right
              camang+=0.02;
              clear();
            }
            if(k[219]){//[ - down
              startpos.z-=0.01;
              clear();
            }
            if(k[221]){//] - up
              startpos.z+=0.01;
              clear();
            }
            if(k[221]){//] - up
              startpos.z+=0.01;
              clear();
            }
          }
      		for(var n=0; n<150; n++){//calculate
            if (!layering) {//don't layer
              if (loops>useh*usew) {
                break;
              }
            }
            i=loops%usew+Math.random();
            j=(Math.floor(loops/usew))%useh+Math.random();
            // i=loops%usew;
            // j=(Math.floor(loops/usew))%useh;
            camwid=TAU/3;
            anghor=camwid*(i+0.5)/usew+camang-camwid/2;
            angver=PI/2*(j+0.5)/useh-PI/4;
            // camwid=TAU;
            // anghor=TAU*(i+0.5)/usew+camang+PI;
            // angver=PI*(j+0.5)/useh-PI/2;
            ray=startpos.copy();
            fog=0;
            colpass=new Color(1);//how much emitted light gets from current position to camera
            colres=new Color(0);//what light is sensed (add to during path)
            lasthit=undefined;
            var collisionNum=0;
            var reflected=false;
            stepcalc();
      			while(!(colpass.r<minColorCast && colpass.g<minColorCast && colpass.b<minColorCast) && collisionNum<50){
              var minDist=Infinity;
              var minObj=undefined;

              for (var th = 0; th < things.length; th++) {//find closest object that gets hit
                var p0=things[th][2].copy(); var p1=things[th][3].copy(); var p2=things[th][4].copy();
                var p01=p1.sub(p0); var p02=p2.sub(p0);
                var la=ray.copy(); var labNeg=step.neg();

                var dotWith=la.sub(p0).div(labNeg.dot(p01.cross(p02)));

                var t=p01.cross(p02).dot(dotWith);

                function setRecord() {
                  minDist=t;
                  minObj=things[th];
                }

                var thingType=things[th][0];
                if (thingType=="tri") {
                  var u=p02.cross(labNeg).dot(dotWith);
                  var v=labNeg.cross(p01).dot(dotWith);
                  if (u>=0 && v>=0 && u+v<=1 && t>0.001 && t<minDist) {//object is in correct direction and is the closest yet
                    setRecord();
                  }
                }
                else if (thingType=="hs") {
                  if (t>0.001 && t<minDist) {//object is in correct direction and is the closest yet
                    setRecord();
                  }
                }
              }

              if (ray.add(step.mult(minDist)).len()>sphereRadius) {//bounding sphere
                colpass=colpass.mult(fogBase**minDist);
                colres=colres.add(new Color(1).mult(colpass));
                break;
              }

              if (minObj!=undefined) {//a collision happened, do light calculations
                colpass=colpass.mult(fogBase**minDist);

                var p0=minObj[2].copy(); var p1=minObj[3].copy(); var p2=minObj[4].copy();
                  var p01=p1.sub(p0); var p02=p2.sub(p0);
                  var la=ray.copy(); var labNeg=step.neg();

                  var norm=p01.cross(p02).unit();

                  var dotWith=la.sub(p0).div(labNeg.dot(p01.cross(p02)));

                  var t=p01.cross(p02).dot(dotWith);
                  var u=p02.cross(labNeg).dot(dotWith);
                  var v=labNeg.cross(p01).dot(dotWith);

                ray=ray.add(step.mult(t));//set ray position to collision place
                colres=colres.add(minObj[1].light.mult(1-minObj[1].gloss).mult(colpass));//add the color of currently collided object
                colpass=colpass.mult(minObj[1].color);

                if (minObj[1].gloss!=0) {//material is somewhat glossy
                  colpass=colpass.mult(minObj[1].gloss);
                  var negStepDir=step.neg().unit();

                  step=norm.mult(2*norm.dot(negStepDir)).sub(negStepDir);
                  reflected=true;
                }
                else {//no gloss, // TODO: random angle, currently just stop
                  break;
                }

              }
              else {//no collisions happened
                colres=colres.add(new Color(0.05, 0.05, 0.05).mult(colpass));
                // colres=new Color(0, 0, 0);
                break;
              }
              collisionNum++;

              // if (minObj) {//if any object has been hit
              //   ray.x+=step.x*minDist;
              //   ray.y+=step.y*minDist;
              //   ray.z+=step.z*minDist;
              //   colpass=colpass.div(1.01**minDist);
              //   // minObj[1].hit();
              // }
              // else{

              // }

              //   data.push([rayx,rayy,rayz]);
              // }
              // lasthit=minObj;
              // break;
            }

            if (true) {//update image array and draw current pixel
              i=Math.floor(i);
              j=Math.floor(j);
              var e=1/ 2 ;//something to do with gamma
              arr[i][j][0]+=Math.pow(colres.r, e);
              arr[i][j][1]+=Math.pow(colres.g, e);
              arr[i][j][2]+=Math.pow(colres.b, e);
              arr[i][j][3]++;
              e=arr[i][j];
              context.fillStyle="rgba(0,0,0,0)";
              context.fillStyle="rgb("+e[0]/e[3]*256+","+e[1]/e[3]*256+","+e[2]/e[3]*256+")";
              context.fillRect(i*pixsize,j*pixsize,pixsize,pixsize);
            }
            loops++;
          }
          // if (true) {//log data
          //   for (var i = 0; i < data.length; i++) {
          //     curang=[atan4(startpos.x, data[i].x, startpos.y, data[i].y), Math.asin(ray.z-startpos.z)];
          //     curpos=[(curang[0]-camang)/TAU*canvas.width, (curang/PI+0.5)*canvas.height];
          //     context.fillRect(curpos.x, curpos.y, 10, 10);
          //   }
          // }
          window.requestAnimationFrame(update);//loop

      }

      function clear() {
        usew=Math.ceil(canvas.width/pixsize)+1;
        useh=Math.ceil(canvas.height/pixsize)+1;
        arr=new Array(usew);
        for (var i = 0; i < arr.length; i++) {
          arr[i]=new Array(useh);
          for (var j = 0; j < arr[i].length; j++) {
            arr[i][j]=[0,0,0,0];
          }
        }
        loops=0;
      }
      function restart() {
        clear();
        update();
      }

    function Color(r=255, g=0, b=255, a=1) {
      this.r=r;
      this.g=g;
      this.b=b;
      this.a=a;
      this.copy=function() {
        return new Color(this.r, this.g, this.b, this.a);
      }
      this.each=function(f) {
        return new Color(f(this.r), f(this.g), f(this.b));
      }
      this.modify=function(amp) {
        return this.each(function(n) {
          var x=n+rand0(amp);
          if (x>255) {
            return 255;
          }
          else if (x<0) {
            return 0;
          }
          else {
            return x;
          }
        });
      }
      this.add=function(v) {
        return new Color(this.r+v.r, this.g+v.g, this.b+v.b);
      }
      this.sub=function(v) {
        return new Color(this.r-v.r, this.g-v.g, this.b-v.b);
      }
      this.mult=function(v) {
        return new Color(this.r*v, this.g*v, this.b*v);
      }
      this.rgb=function() {
        return "rgba("+this.r+","+this.g+","+this.b+", "+this.a+")";
      }
    }

    function Vec2(x=0, y=0) {
      this.x=x;
      this.y=y;
      this.copy=function() {
        return new Vec2(this.x, this.y);
      }
      this.add=function(v1, v2) {// FIXME: doesn't always work with both values
        if (v2) {
          return new Vec2(this.x+v1, this.y+v2);
        }
        return new Vec2(this.x+v1.x, this.y+v1.y);
      }
      this.sub=function(v) {
        return new Vec2(this.x-v.x, this.y-v.y);
      }
      this.mult=function(n) {
        return new Vec2(this.x*n, this.y*n);
      }
      this.div=function(n) {
        return new Vec2(this.x/n, this.y/n);
      }
      this.dot=function(v) {
        return v.x*this.x + v.y*this.y;
      }
      this.iHatLanding=function(v) {
        return new Vec2(v.x*this.x-v.y*this.y, v.x*this.y+v.y*this.x);
      }
      this.len=function() {
        return Math.sqrt(this.x**2+this.y**2);
      }
      this.dist=function(v) {
        return Math.sqrt((this.x-v.x)**2+(this.y-v.y)**2);
      }
      this.sqDist=function(v) {
        return (this.x-v.x)**2+(this.y-v.y)**2;
      }
      this.unit=function() {
        var len=Math.sqrt(this.x**2+this.y**2);
        return new Vec2(this.x/len, this.y/len);
      }
      this.dir=function() {//angle to x axis in radians
        return Math.atan2(this.y, this.x);
      }
      this.taxi=function() {//taxicab distance length
        return this.x+this.y;
      }
      this.screen=function() {//coordinates for drawing
        return new Vec2((this.x-cameraOffset.x)*height/screenBlockHeight, (this.y-cameraOffset.y)*height/screenBlockHeight);
      }
    }
    function rand0Vec2(v=1) {
      return new Vec2(rand0(v), rand0(v));
    }
    function polarVec2(d, m=1) {//cartesian vector from polar coordinates
      return new Vec2(Math.cos(d)*m, Math.sin(d)*m);
    }

    function Particle(pos, vel, size, color, maxAge, calc, step, drawcalc, draw) {
      this.pos=pos;
      this.vel=vel || new Vec2(rand0(0.1), rand0(0.1));
      this.size=size || randRange(0.06, 0.2);
      this.color=color || colors.darkRed.copy();
      this.maxAge=maxAge || 50;
      this.age=0;
      this.update=function () { this.age++; this.calc(); this.step(); this.drawcalc(); this.draw() };
      this.calc=calc || function() {};
      this.step=step || function() { this.pos=this.pos.add(this.vel); }
      this.drawcalc=drawcalc || function() { this.color.a=1-this.age/this.maxAge; }
      this.draw=draw || function() {
        context.fillStyle=this.color.rgb();
        var screenSize=this.size*height/screenBlockHeight;
        var drawPos=this.pos.screen();
        context.fillRect(drawPos.x-screenSize/2, drawPos.y-screenSize/2, screenSize, screenSize);
      }
    }

        context.strokeStyle=color.rgb ? color.rgb() : color;
        context.lineWidth=width;
        context.beginPath();
        var e=p1.screen();
        context.moveTo(e.x, e.y);
        e=p2.screen();
        context.lineTo(e.x, e.y);
        context.stroke();
      }
      var quickVec2Line= function (p1, p2, width=2, color=colors.yellow) {
        context.strokeStyle=color.rgb ? color.rgb() : color;
        context.lineWidth=width;
        context.beginPath();
        context.moveTo(p1.x, p1.y);
        context.lineTo(p2.x, p2.y);
        context.stroke();
      }
      var quickVec2ScreenSquare= function (p, width=4, color=colors.yellow) {
        context.fillStyle=color.rgb ? color.rgb() : color;

        context.fillRect(e.x-width/2, e.y-width/2, width, width);

            if (player.downOnFloor) {//sliding friction
              var forwardSpeed=player.vel.dot(polarVec2(player.ang));

              if (forwardSpeed>0.13) {

                player.slideLength++;
              }
              else {

              }

              // console.log(forwardSpeed, player.vel.y, player.vel.unit().y);
              if (player.sliding) {
                if (player.slideLength<40) {
                  player.vel=polarVec2(player.ang).mult(forwardSpeed*0.98);

                }
                else {
                  player.sliding=false;
                  player.vel=polarVec2(player.ang).mult(forwardSpeed*0.9);

                }
              }
              else {
                player.sliding=false;
                player.vel=polarVec2(player.ang).mult(forwardSpeed*0.7);
                player.angVel*=0.4;
              }
            }
            else {//non-sliding "friction"
              player.sliding=false;
              if ((keys[38] || keys[87]) ^ (keys[40] || keys[83])) {//walking "friction"

          // TODO: collision very broken after turning, different body shape and arms

            // var curBlocks=[//blocks in all corners of player hitbox // TODO: glitchy at left edge of screen because of subtraction  but glitchy on left side collision without it
            //   curLevelGrid[Math.floor(player.pos.x*20-0.00001)][Math.floor(player.pos.y*20-0.00001)],

            //   curLevelGrid[Math.floor(player.pos.x*20-0.00001)][Math.floor((player.pos.y+player.size)*20)],
            //   curLevelGrid[Math.floor((player.pos.x+player.size)*20)][Math.floor((player.pos.y+player.size)*20)]

            var curBlocks=[//blocks in all corners of player hitbox
              curLevelGrid[Math.floor(player.pos.x)][Math.floor(player.pos.y)],
              curLevelGrid[Math.floor(player.pos.x+player.size)][Math.floor(player.pos.y)],

            if (arrayContains(curBlocks, 3)) {//hit kill block, die // TODO: kills through diagonal blocks, on flat surfaces // TODO: other kill blocks
              player.die();
            }
            else {//don't die, check other collisions
              function collideTop() {//run on collision with ceiling
                player.pos.y=player.pos.y-(player.pos.y%(1/levelHeight))+1/levelHeight;
                player.vel.y=0;
              }
              function collideBottom() {//run on collision with floor
                player.pos.y=player.pos.y-((player.pos.y+player.size)%(1/levelHeight));
                player.vel.y=0;
              }
              function collideLeft() {
                player.pos.x=player.pos.x-(player.pos.x%(1/levelHeight))+1/levelHeight;
                player.vel.x=0;
              }
              function collideRight() {
                player.pos.x=player.pos.x-((player.pos.x+player.size)%(1/levelHeight));
                player.vel.x=0;
              }
              // var calcDisp={
              //   top: function() {
              //     return Math.abs(player.pos.y-(player.pos.y-(player.pos.y%(1/levelHeight))+1/levelHeight));
              //   },
              //   bottom: function() {
              //     return Math.abs(player.pos.y-(player.pos.y-((player.pos.y+player.size)%(1/levelHeight))));
              //   },
              //   left: function() {
              //     return Math.abs(player.pos.x-(player.pos.x-(player.pos.x%(1/levelHeight))+1/levelHeight));
              //   },
              //   right: function() {
              //     return Math.abs(player.pos.x-(player.pos.x-((player.pos.x+player.size)%(1/levelHeight))));
              //   }
              // }

              var colCorners=[];
              var colNum=0;
              for (var i = 0; i < curBlocks.length; i++) {
                colCorners[i]=arrayContains(blockTypes.topCollision, curBlocks[i]);
                if (colCorners[i]) colNum++;
              }
              var noColCorners=[];
              for (var i = 0; i < curBlocks.length; i++) {
                noColCorners[i]=arrayContains(blockTypes.noCollision, curBlocks[i]);
              }

              if (colNum==0) {//no collisions
                player.timeSinceGround++;
              }
              else if (colNum==2 || colNum==3) {
                if (//diagonals // TODO:
                  colNum==2 && ((colCorners[0] && colCorners[3]) || (colCorners[1] && colCorners[2]))
                  ) {
                  // if (colCorners[0] && colCorners[3]) {
                  //   if (player.pos.y+player.size-player.pos.x>posCeil.x-posCeil.y) {
                  //     colCorners[1]=true;
                  //   }
                  //   else {
                  //     colCorners[2]=true;
                  //   }
                  // }
                  // else {
                  //   if (player.pos.y+player.pos.x>posCeil.x+posCeil.y) {
                  //     colCorners[0]=true;
                  //   }
                  //   else {
                  //     colCorners[3]=true;
                  //   }
                  // }
                  // colNum++;
                  // console.log("aaa");

                  if (colCorners[0]) {//top left
                    if (player.pos.x-player.pos.y<posCeil.x-posCeil.y) {
                      collideTop();
                    }
                    else {
                      collideLeft();
                    }
                  }
                  if (colCorners[1]) {//top right
                    if (player.pos.x+player.pos.y+player.size>posCeil.x+posCeil.y) {
                      collideTop();
                    }
                    else {
                      collideRight();
                    }
                  }
                  if (colCorners[2]) {//bottom left
                    if (player.pos.x+player.pos.y+player.size<posCeil.x+posCeil.y) {
                      collideBottom();
                    }
                    else {
                      collideLeft();
                    }
                  }
                  if (colCorners[3]) {//bottom right (hit left corner of floor)
                    if (player.pos.x-player.pos.y>posCeil.x-posCeil.y) {
                      collideBottom();
                    }
                    else {
                      collideRight();
                    }
                  }

                }
                if (colCorners[0] && colCorners[1]) {//top (hit the ceiling)
                  collideTop();
                }
                if (colCorners[2] && colCorners[3]) {//bottom (hit the floor)
                  collideBottom();
                }
                if (colCorners[0] && colCorners[2]) {//left
                  collideLeft();
                  // // if (keys[37]) {
                  // if (true) {
                  //   player.grabWall(1);
                  // }
                  // else {
                  //   player.timeSinceGround++;
                  // }
                }
                if (colCorners[1] && colCorners[3]) {//right
                  collideRight();
                  // // if (keys[39]) {
                  // if (true) {
                  //   player.grabWall(2);
                  // }
                  // else {
                  //   player.timeSinceGround++;
                  // }
                }

              }
              else if (colNum==1) {//single block floor or ceiling
                if (colCorners[0]) {//top left
                  if (player.pos.x-player.pos.y<posCeil.x-posCeil.y) {
                    collideTop();
                  }
                  else {
                    collideLeft();
                  }
                }
                if (colCorners[1]) {//top right
                  if (player.pos.x+player.pos.y+player.size>posCeil.x+posCeil.y) {
                    collideTop();
                  }
                  else {

                if (colCorners[2]) {//bottom left

                  // // if (player.pos.x+player.pos.y+player.size<posCeil.x+posCeil.y) {
                  // //   collideBottom();
                  // //   console.log("bot");
                  // // }
                  // // else {
                  // //   collideLeft();
                  // //   console.log("left");
                  // // }
                  // // console.log(calcDisp.left());
                  //
                  // // console.log(calcDisp.bottom(), "<", calcDisp.left());
                  // // // console.log(calcDisp.bottom()<calcDisp.left());
                  // // if (calcDisp.bottom() < calcDisp.left()) {
                  // //   console.log("true, bot");
                  // //   collideBottom();
                  // // }
                  // // else {
                  // //   console.log("false, left");
                  // //   console.log(round(player.pos.x, 4), round(player.pos.y, 4));
                  //   collideLeft();
                  // //   console.log(round(player.pos.x, 4), round(player.pos.y, 4));
                  // //   // console.log(calcDisp.left());
                  // // }

                  if (player.pos.x+player.pos.y+player.size<posCeil.x+posCeil.y) {
                    collideBottom();
                  }
                  else {
                    collideLeft();
                  }
                }
                if (colCorners[3]) {//bottom right (hit left corner of floor)
                  if (player.pos.x-player.pos.y>posCeil.x-posCeil.y) {
                    collideBottom();
                  }
                  else {
                    collideRight();
                  }
                }
                // if (colCorners[2]) {//single block floor
                //   collideBottom();
                // }
                // if (colCorners[0] || colCorners[1]) {//single block ceiling (// TODO: maybe wall)
                //   collideTop();
                // }
              }
              // else if (colNum==4) {//inside block or blocks, what to do? // TODO:
              //   console.log("aaaaaaaaaaaaaaahhhhhhhhhhhhh stuck!!!");
              // }
            }
          }
          else {//handle screen edge collision
            if (player.pos.x<0) {//left
              player.pos.x=0;
              player.vel.x=0;
            }
            else if (player.pos.x>levelRatio*levelHeight-player.size) {//right
              player.pos.x=levelRatio*levelHeight-player.size;
              player.vel.x=0;
            }
            if (player.pos.y<0) {//top
              player.pos.y=0;
              player.vel.y=0;
            }
            else if (player.pos.y>levelHeight-player.size) {//bottom also reset jumping
              player.pos.y=levelHeight-player.size;
              player.vel.y=0;
            }
            player.die();
          }

          if (true) {//check if a pole is being grabbed, change movement appropriately
            // TODO: fancier swing around poles (account for center of mass, current velocity, angle of approach)
            player.leftPole=false;
            player.rightPole=false;
            // if (player.leftHandPos>0.9) {//check left hand pole
            if (player.extendingLeftArm) {//check left hand pole
              // var curCoords=player.pos.sub(player.getCenterToLeftHand());
              var curCoords=player.pos.add(player.getCenterToLeftHand());
              var curBlock=arr2DReadAttempt(// TODO: instead of just closest block, use surrounding blocks
                curLevelGrid,
                Math.floor(curCoords.x),
                Math.floor(curCoords.y)
              );
              if (curBlock!=undefined) {
                if (arrayContains(blockTypes.centerPole, curBlock)) {
                  var handToPoleDist=Math.sqrt((curCoords.x%1-0.5)**2+(curCoords.y%1-0.5)**2);
                  if (handToPoleDist<=0.3) {
                    // player.leftPole=true;
                    player.leftPole=new Vec2(Math.floor(curCoords.x)+0.5, Math.floor(curCoords.y)+0.5);
                  }
                }
              }
            }
            // if (player.rightHandPos>0.9) {//check right hand pole
            if (player.extendingRightArm) {//check right hand pole
              // var curCoords=player.pos.sub(player.getCenterToRightHand());
              var curCoords=player.pos.add(player.getCenterToRightHand());
              var curBlock=arr2DReadAttempt(// TODO: instead of just closest block, use surrounding blocks
                curLevelGrid,
                Math.floor(curCoords.x),
                Math.floor(curCoords.y)
              );
              if (curBlock!=undefined) {
                if (arrayContains(blockTypes.centerPole, curBlock)) {
                  var handToPoleDist=Math.sqrt((curCoords.x%1-0.5)**2+(curCoords.x%1-0.5)**2);
                  if (handToPoleDist<=0.3) {
                    // player.rightPole=true;
                    player.rightPole=new Vec2(Math.floor(curCoords.x)+0.5, Math.floor(curCoords.y)+0.5);
                  }
                }
              }
            }
            if (player.leftPole && player.rightPole) {//grabbing poles on both sides, stop immediately // TODO: check force on arms???
              player.freeze();
            }
          }
        }
        if (true) {//entity physics
          for (var i = 0; i < entities.length; i++) {
            entities[i].update();
            var maxEntityDist=1.2;
            if (true) {
            // if (!entities[i].dead) {
              if (entities[i].pos.sub(player.defaultLeftTarget).len()<maxEntityDist) {
                leftTargetGoalSelection.push(["enemy", i, entities[i].pos.sub(player.pos).len(), 1]);
              }
              if (entities[i].pos.sub(player.defaultRightTarget).len()<maxEntityDist) {
                rightTargetGoalSelection.push(["enemy", i, entities[i].pos.sub(player.pos).len(), 1]);
              }
            }
          }
        }
        if (true) {//target position physics
          // player.targetDefaultPos=player.pos.add(polarVec2(player.ang, 0.4+player.vel.dot(polarVec2(player.ang))*10));

          if (true) {//add poles to targetGoalSelection // TODO: each hand targets
            var maxPoleDist=0.6;
            // for (var i = Math.round(player.targetDefaultPos.x-maxPoleDist); i < player.targetDefaultPos.x+maxPoleDist; i++) {
            //   for (var j = Math.round(player.targetDefaultPos.y-maxPoleDist); j < player.targetDefaultPos.y+maxPoleDist; j++) {
            //     if (arr2DReadAttempt(curLevelGrid, i, j)==4) {
            //       targetGoalSelection.push(["pole", [i, j], new Vec2(i+0.5, j+0.5).sub(player.targetDefaultPos).len(), 0.5]);
            //     }
            //   }
            // }
            for (var i = Math.round(player.defaultLeftTarget.x-maxPoleDist); i < player.defaultLeftTarget.x+maxPoleDist; i++) {
              for (var j = Math.round(player.defaultLeftTarget.y-maxPoleDist); j < player.defaultLeftTarget.y+maxPoleDist; j++) {
                if (arr2DReadAttempt(curLevelGrid, i, j)==4) {
                  leftTargetGoalSelection.push(["pole", [i, j], new Vec2(i+0.5, j+0.5).sub(player.defaultLeftTarget).len(), 0.5]);
                }
              }
            }
            for (var i = Math.round(player.defaultRightTarget.x-maxPoleDist); i < player.defaultRightTarget.x+maxPoleDist; i++) {
              for (var j = Math.round(player.defaultRightTarget.y-maxPoleDist); j < player.defaultRightTarget.y+maxPoleDist; j++) {
                if (arr2DReadAttempt(curLevelGrid, i, j)==4) {
                  rightTargetGoalSelection.push(["pole", [i, j], new Vec2(i+0.5, j+0.5).sub(player.defaultRightTarget).len(), 0.5]);
                }
              }
            }
          }

          var newTarget=undefined;
          var curHighestImportance=0;
          for (var i = 0; i < leftTargetGoalSelection.length; i++) {
            var curImportance=(1-clamp(leftTargetGoalSelection[i][2]))*leftTargetGoalSelection[i][3];
            if (curImportance>curHighestImportance) {
              curHighestImportance=curImportance;
              newTarget=leftTargetGoalSelection[i];
            }
          }
          var targetMovementCoefficient=0.6;
          var targetStrengthCoefficient=0.2;
          if (newTarget && player.extendingLeftArm) {//target located and arm is extended

            switch (newTarget[0]) {
              case "enemy":
                var newTargetPos=entities[newTarget[1]].pos;
                break;
              case "pole":
                var newTargetPos=new Vec2(newTarget[1][0]+0.5, newTarget[1][1]+0.5);
                break;
            }
            player.activelyTargetingLeft=true;
            player.targetStrengthLeft=(player.targetStrengthLeft+0.9*targetStrengthCoefficient)/(1+targetStrengthCoefficient)
            player.targetPosLeft=player.targetPosLeft.add(
              newTargetPos.mult(targetMovementCoefficient)
            ).div(1+targetMovementCoefficient);
          }
          else {//no target, go to default
            player.activelyTargetingLeft=false;
            player.targetStrengthLeft=(player.targetStrengthLeft+0.2*targetStrengthCoefficient)/(1+targetStrengthCoefficient)
            player.targetPosLeft=player.targetPosLeft.add(
              player.defaultLeftTarget.mult(targetMovementCoefficient)
            ).div(1+targetMovementCoefficient);
          }

          var newTarget=undefined;
          var curHighestImportance=0;
          for (var i = 0; i < rightTargetGoalSelection.length; i++) {
            var curImportance=(1-clamp(rightTargetGoalSelection[i][2]))*rightTargetGoalSelection[i][3];
            if (curImportance>curHighestImportance) {
              curHighestImportance=curImportance;
              newTarget=rightTargetGoalSelection[i];
            }
          }
          var targetMovementCoefficient=0.6;
          var targetStrengthCoefficient=0.2;
          if (newTarget && player.extendingRightArm) {//target located and arm is extended

            switch (newTarget[0]) {
              case "enemy":
                var newTargetPos=entities[newTarget[1]].pos;
                break;
              case "pole":
                var newTargetPos=new Vec2(newTarget[1][0]+0.5, newTarget[1][1]+0.5);
                break;
            }
            player.activelyTargetingRight=true;
            player.targetStrengthRight=(player.targetStrengthRight+0.9*targetStrengthCoefficient)/(1+targetStrengthCoefficient)
            player.targetPosRight=player.targetPosRight.add(
              newTargetPos.mult(targetMovementCoefficient)
            ).div(1+targetMovementCoefficient);
          }
          else {//no target, go to default
            player.activelyTargetingRight=false;
            player.targetStrengthRight=(player.targetStrengthRight+0.2*targetStrengthCoefficient)/(1+targetStrengthCoefficient)
            player.targetPosRight=player.targetPosRight.add(
              player.defaultRightTarget.mult(targetMovementCoefficient)
            ).div(1+targetMovementCoefficient);
          }
        }
        if (loops% frameskip <1) draw();//animation
        loops++;
        window.requestAnimationFrame(update);
      }
    }

    function draw() {
      context.clearRect(0, 0, canvas.width, canvas.height);

      var cameraSpeed=0.2;
      // cameraOffset=new Vec2(player.pos.x-screenBlockWidth/2, player.pos.y-screenBlockHeight/2);
      cameraOffset=cameraOffset.add(new Vec2(player.pos.x-screenBlockWidth/2, player.pos.y-screenBlockHeight/2).mult(cameraSpeed)).div(1+cameraSpeed);

      // var curSquareSize=height/screenBlockHeight;//block size in pixels
      for (var i = 0; i < screenBlockWidth+1; i++) {//draw blocks
        var iReal=i+cameraOffset.x;
        if (curLevelGrid[Math.floor(iReal)]!=undefined) {
          for (var j = 0; j < screenBlockHeight+1; j++) {
            var jReal=j+cameraOffset.y;
            var curBlock=curLevelGrid[Math.floor(iReal)][Math.floor(jReal)];
            // if (randProb(0.1) && loops==0) {
            //   console.log(Math.floor(iReal), Math.floor(jReal));
            // }
            if (curBlock!=0 && curBlock!=undefined) {
              // context.fillStyle=blockTypes.colors[curLevelGrid[i][j]].rgb();
              // context.fillRect(Math.floor(i*curSquareSize), Math.floor(j*curSquareSize), Math.ceil(curSquareSize), Math.ceil(curSquareSize));
              // quickVec2TopLeftScreenSquare(new Vec2(i, j), curSquareSize+1, blockTypes.colors[curBlock]);
              // if (randProb(0.1) && loops==0) {
              //   console.log(context.fillStyle, curBlock, blockTypes.colors[curLevelGrid[i][j]].rgb());
              // }
              context.fillStyle=blockTypes.colors[curBlock].rgb();

              // context.fillRect((i-cameraOffset.x/2)*curSquareSize, (j-cameraOffset.y/2)*curSquareSize, Math.ceil(curSquareSize), Math.ceil(curSquareSize));
              context.fillRect((i-mod(cameraOffset.x, 1))*curSquareSize, (j-mod(cameraOffset.y, 1))*curSquareSize, Math.ceil(curSquareSize), Math.ceil(curSquareSize));
              if (randProb(0.1) && loops==0) {
                // console.log(iReal*curSquareSize, jReal*curSquareSize, Math.ceil(curSquareSize), context.fillStyle, curBlock);
              }
              if (blockTypes.specialDraw[curBlock]!=undefined) {
                // blockTypes.specialDraw[curBlock](i-cameraOffset.x%1, j-cameraOffset.y%1);// TODO: also block width?
                // blockTypes.specialDraw[curBlock](i+mod(cameraOffset.x, 1), j+mod(cameraOffset.y, 1));
                blockTypes.specialDraw[curBlock](i+Math.floor(cameraOffset.x), j+Math.floor(cameraOffset.y));
                // blockTypes.specialDraw[curBlock](i, j);
              }
            }
          }
        }
      }

      for (var i = 0; i < entities.length; i++) {
        entities[i].draw();
      }

      player.draw();
      if (true) {//draw targets
        var pos=player.targetPosLeft.screen();
        context.strokeStyle="rgb(200, 210, 255, "+player.targetStrengthLeft+")";
        context.lineWidth=3;
        context.beginPath();
        context.arc(pos.x, pos.y, curSquareSize*0.4, 0, TAU);
        context.stroke();
        var pos=player.targetPosRight.screen();
        context.strokeStyle="rgb(200, 210, 255, "+player.targetStrengthRight+")";
        context.lineWidth=3;
        context.beginPath();
        context.arc(pos.x, pos.y, curSquareSize*0.4, 0, TAU);
        context.stroke();
      }

      for (var i = 0; i < particles.length; i++) {//update and draw particles
        var p=particles[i];
        if (p.age+1>p.maxAge) {//delete if too old
          particles.splice(i, 1);
          i--;
          continue;
        }
        p.update();
      }
      for (var i = 0; i < logPoints.length; i++) {
        quickVec2ScreenSquare(logPoints[i]);
      }
    }

    function restart() {// TODO: maybe useless
      loops=0;
    }
    function resize() {
      canvas.width=window.innerWidth;
      height=canvas.height=window.innerHeight;
      curSquareSize=height/screenBlockHeight;//block size in pixels
      screenBlockWidth=screenBlockHeight*canvas.width/canvas.height;
      restart();// TODO: maybe will cause problems with animation, probably useless
    }
    resize();
    update();

    // canvas.addEventListener("mousemove",function(){
    //   // lastx=event.clientX;
    //   // lasty=event.clientY;
    //   var n=1;
    //   lastx=(event.clientX+lastx*n)/(n+1);
    //   lasty=(event.clientY+lasty*n)/(n+1);
    // });
    canvas.addEventListener("mouseup",function(){lastButtons=event.buttons});
    canvas.addEventListener("mousedown",function() {lastButtons=event.buttons});
    // window.addEventListener("dblclick", function() {location.reload()});
    window.addEventListener("keyup",function(){
      var curKey=event.keyCode;
      keys[curKey]=false;
      // console.log(keys);
    });
    window.addEventListener("keydown",function(){
      var curKey=event.keyCode;
      keys[curKey]=true;
      // console.log(keys);
      // console.log(curKey);
      switch (curKey) {
        case 32://space
          paused=!paused;
          console.log(paused?"Paused":"Unpaused");
          update();
          break;
        // case 37://left
        //   move.left();
        //   break;
      }
    });
    window.addEventListener("resize",function(){resize();})
  </script>

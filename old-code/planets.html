    function rand(max=1) {
      return Math.random()*max;
    }
    function rand0(max=1) {
      return (Math.random()-0.5)*max;
    }
    function randint(max=2) {
      return Math.floor(Math.random()*max);
    }
    function clamp(num, val=1) {//num to clamp, special value
      return 1+(val/(num+val));
    }
    function collerp(x, n1, n2) {//x==0 => n1; x==1 => n2
      return n2.sub(n1).mult(x).add(n1);
    }
    function dot(a, b) {//array a *dot* array b
      var res=0;
      for (var i = 0; i < a.length; i++) {
        res+=a[i]*b[i];
      }
      return res;
    }
    function sub(a, b) {//array a - array b
      var res=[];
      for (var i = 0; i < a.length; i++) {
        res.push(a[i]-b[i]);
      }
      return res;
    }
    function atan4(x1, y1, x2, y2) {
      return Math.atan2(y2-y1, x2-x1);
    }
    function copyarr(a) {
      var res=[]
      for (var i = 0; i < a.length; i++) {
        res[i]=a[i];
      }
      return res;
    }
    function fliparr(a) {
      var res=[];
      for (var i = 0; i < a[0].length; i++) {
        res[i]=[]
        for (var j = 0; j < a.length; j++) {
          res[i][j]=a[j][i]
        }
      }
      return res;
    }

    var TAU=6.2832;//variable declaration
      var PI=3.1416;

    function Color(r=255, g, b, a=1) {
      if (g != undefined) {//all colors set
        this.r=r;
        this.g=g;
        this.b=b;
      }
      else {//only red (use as brightness)
        // console.log("a");
        this.r=r;
        this.g=r;
        this.b=r;
      }
      this.a=a || 1;
      this.each=function(f) {
        return new Color(f(this.r), f(this.g), f(this.b));
      }
      this.modify=function(amp) {
        return this.each(function(n) {
          var x=n+rand0(amp);
          if (x>255) {
            return 255;
          }
          else if (x<0) {
            return 0;
          }
          else {
            return x;
          }
        });
      }
      this.lighten=function(v) {
        return this.each(function(n) {
          var x=n+v;
          if (x>255) {
            return 255;
          }
          else if (x<0) {
            return 0;
          }
          else {
            return x;
          }
        });
      }
      this.darken=function(v) {
        return this.each(function(n) {
          var x=n-v;
          if (x>255) {
            return 255;
          }
          else if (x<0) {
            return 0;
          }
          else {
            return x;
          }
        });
      }
      this.add=function(v) {
        return new Color(this.r+v.r, this.g+v.g, this.b+v.b);
      }
      this.sub=function(v) {
        return new Color(this.r-v.r, this.g-v.g, this.b-v.b);
      }
      this.mult=function(v) {
        return new Color(this.r*v, this.g*v, this.b*v);
      }
      this.div=function(v) {
        return new Color(this.r/v, this.g/v, this.b/v);
      }
      this.rgb=function() {
        return "rgb("+this.r+","+this.g+","+this.b+")";
      }
      this.rgba=function(a=this.a) {
        return "rgba("+this.r+","+this.g+","+this.b+","+a+")";
      }
    }
    function Vec2(x=0, y=0) {
      this.x=x;
      this.y=y;
      this.set=function(v) {
        this.x=v.x;
        this.y=v.y;
      }
      this.copy=function() {
        return new Vec2(this.x, this.y);
      }
      this.add=function(v) {
        return new Vec2(this.x+v.x, this.y+v.y);
      }
      this.sub=function(a, b) {
        if (b) {
          return new Vec2(this.x-a, this.y-b);
        }
        return new Vec2(this.x-a.x, this.y-a.y);
      }
      this.mult=function(n) {
        return new Vec2(this.x*n, this.y*n);
      }
      this.div=function(n) {
        return new Vec2(this.x/n, this.y/n);
      }
      this.dot=function(v) {
        return this.x*v.x+this.y*v.y;
      }
      this.avg=function(v) {
        return new Vec2((this.x+v.x)/2,(this.y+v.y)/2);
      }
      this.len=function() {
        return Math.sqrt(this.x**2+this.y**2);
      }
      this.sqlen=function() {
        return this.x**2+this.y**2;
      }
      this.total=function() {
        return this.x+this.y;
      }
      this.neg=function() {
        return new Vec2(-this.x, -this.y);
      }
      this.unit=function() {
        var l=this.len();
        return new Vec2(this.x/l, this.y/l);
      }
      this.dist=function(v) {
        return this.sub(v).len();
      }
    }
    function Planet(id, pos, vel, m, c) {
      this.id=id;
      this.pos=pos;
      this.lpos=pos;
      this.vel=vel;
      this.m=m;
      this.c=c;
      this.reldist=function(p){
        return Math.sqrt((this.pos.x-p.pos.x)**2+(this.pos.y-p.pos.y)**2);
      }
      this.step=function(){//add vel to pos
        this.lpos=this.pos.copy();
        this.pos=this.pos.add(this.vel.mult(1));
      }
      this.calc=function(){//calculate and add acceleration to vel
        var d=this.pos.len();
        if (d>pmindist) {
          this.vel=this.vel.add(this.pos.unit().mult(-G*origing/d));
          // this.vel=this.vel.add(this.pos.unit().mult(-G*origing));
        }
        for (var i = 0; i < planets.length; i++) {
          if (this.id!=i) {
            var p=planets[i];
            var d=this.reldist(p)
            if (d>pmindist) {
              this.vel=this.vel.add(p.pos.sub(this.pos).unit().mult(G*p.m/d));
            }
          }
        }
      }
    }

    if (true) {//planet generation
      //planets.push(new Planet(0, new Vec2(100,20), new Vec2(-5, -3), 10, new Color(100, 200, 5)));

        }
        //var bmass=2**(pnum/2);
        var bmass=10;
        planets.push(new Planet(//add balncing planet
          pnum,//index
          // new Vec2(150, 0),//position
          totalp.pos.mult(-totalp.m/bmass),//position to balance
          // new Vec2(),//velocity
          totalp.mom.mult(-1/bmass),//velocity to balance other planets

      }
      if (false) {//(random, balancing)*n
        //planets.push(new Planet(0, new Vec2(100,20), new Vec2(-5, -3), 10, new Color(100, 200, 5)));
        var pnum= 8 ; // Number of planets
        var totalp=new Planet(0, new Vec2(), new Vec2(), 0, new Color());
        totalp.mom=new Vec2();

        var velr=0.001;
        var posr=0.4;
        for (var i = 0; i < pnum; i+=2) {
          var p=new Planet(//random planet
            i,//index
            new Vec2(rand0(posr), rand0(posr)),//position

            //2**rand(3),//mass // TODO: Make mass negative, alike masses attract?
            1,//mass
            new Color(rand(255), rand(255), rand(255))//color
          );
          if (true) {
            totalp.mom=totalp.mom.add(p.vel.mult(p.m));
            totalp.m+=p.m;
            totalp.pos=totalp.pos.add(p.pos)
          }
          planets[i]=p;
          var bmass=1;
          var p=new Planet(//balance planet
            i+1,//index
            // new Vec2(150, 0),//position
            totalp.pos.mult(-totalp.m/bmass),//position to balance
            // new Vec2(),//velocity
            totalp.mom.mult(-1/bmass),//velocity to balance other planets
            bmass,//mass
            new Color(rand(255), rand(255), rand(255))//color
          );
          if (true) { //calc for totalp
            totalp.mom=totalp.mom.add(p.vel.mult(p.m));
            totalp.m+=p.m;
            totalp.pos=totalp.pos.add(p.pos)
          }
          planets[i+1]=p;
        }
        //planets[pnum]=new Planet(pnum, new Vec2(0,0), new Vec2(0, 0), 1, new Color(100, 200, 5));
      }
      if (false) {//1 balancing planet + manual
        var totalp=new Planet(0, new Vec2(), new Vec2(), 0, new Color());
        totalp.mom=new Vec2();
        var pnum=0;
        function addp(p) {

          }
          planets[pnum]=p;
          pnum++;
        }

        // addp(new Planet(
        //   i,//index
        //   new Vec2(rand0(posr), rand0(posr)),//position
        //   new Vec2(rand0(velr), rand0(velr)),//velocity
        //   // new Vec2(),//velocity
        //   //2**rand(3),//mass
        //   // 1,//mass
        //   2**(i/2),//mass
        //   new Color(rand(255), rand(255), rand(255))//color
        // ))

        addp(new Planet(
          0,//index
          new Vec2(0.4, 0),//position

          1,//mass
          new Color(rand(255), rand(255), rand(255))//color
        ))
        addp(new Planet(
          1,//index

          1,//mass

        ))
        addp(new Planet(
          2,//index
          new Vec2(0.4, 0),//position

        ))

        var bmass=3;
        planets.push(new Planet(//add balncing planet
          pnum,//index

          totalp.mom.mult(-1/bmass),//velocity to balance other planets

        ));
        pnum++;
      }
      if (true) {//random*n
        //planets.push(new Planet(0, new Vec2(100,20), new Vec2(-5, -3), 10, new Color(100, 200, 5)));
        var pnum= 4 ; // Number of planets
        var totalp=new Planet(0, new Vec2(), new Vec2(), 0, new Color());
        totalp.mom=new Vec2();

        var velr=0.001;
        var posr=0.4;
        for (var i = 0; i < pnum; i++) {
          var p=new Planet(//random planet
            i,//index
            new Vec2(rand0(posr), rand0(posr)),//position

          if (true) {
            totalp.mom=totalp.mom.add(p.vel.mult(p.m));
            totalp.m+=p.m;

          planets[i]=p;

///////////////////////////////////////////////////////////////////////////////
function draw() {
  if (!paused) {
  if (loops % frameskip < 1) {
    // context.clearRect(-w/2, -h/2, w, h);//clear screen
    if (true && cloops%cskip<1) {//darken screen
      context.fillStyle="rgba(0,0,0,"+0.07+")";//how much darker? (~0.07 is good)
      context.fillRect(-w/2, -h/2, w, h);
    }
    cloops++;
    for (var mcr = 0; mcr < microloops; mcr++) {
      context.lineJoin="round";
      context.lineCap="round";
      context.font="10px arial";
      for (var i = 0; i < planets.length; i++) {//calc
        planets[i].calc();
      }
      for (var i = 0; i < planets.length; i++) {//draw & step
        var p=planets[i];
        // console.log(p);
        p.step();



        // context.strokeStyle="rgb("+
        //   Math.floor((Math.sin(loops/csp*2)+1.5)/2.5*100+p.c.r/2)+","+
        //   Math.floor((Math.sin(loops/csp*Math.E)+1.5)/2.5*100+p.c.g/2)+","+
        //   Math.floor((Math.sin(loops/csp*PI)+1.5)/2.5*100+p.c.b/2)+")";
        context.strokeStyle=p.c.rgb()
        // context.fillStyle="rgb("+
        //   Math.floor((Math.sin(loops/csp*2)+1.5)/2.5*100+p.c.r/2)+","+
        //   Math.floor((Math.sin(loops/csp*Math.E)+1.5)/2.5*100+p.c.g/2)+","+
        //   Math.floor((Math.sin(loops/csp*PI)+1.5)/2.5*100+p.c.b/2)+")";
        // context.fillStyle="rgb(255,255,255)";
        var psize=2*Math.cbrt(p.m);
        var cpos=p.pos.mult(scale);
        // if (i==0) {
        //   center=cpos;
        // }
        var clpos=p.lpos.mult(scale);
        context.lineWidth=psize;
        context.beginPath();
        // context.moveTo(clpos.x-center.x, clpos.y-center.y);
        // context.lineTo(cpos.x-center.x, cpos.y-center.y);
        context.moveTo(clpos.x, clpos.y);
        context.lineTo(cpos.x, cpos.y);
        context.stroke();
        // context.fillRect(cpos.x-psize/2, cpos.y-psize/2, psize, psize);
      }
      // console.log(E);
      mloops++;
    }
  }
  loops++;
  window.requestAnimationFrame(draw);
  }
}

///////////////////////////////////////////////////////////////////////////////

    function restart() {
      loops=0;
    }
    function resize() {
      w=window.innerWidth;
      h=window.innerHeight;
      canvas.width=w;
      canvas.height=h;
      scale=h/2*scalemult;
      context.translate(w/2, h/2);
      restart();
    }
    resize();
    function mouse(e) {
      // lastx=event.clientX;
      // lasty=event.clientY;
      n=1;
      lastx=(e.clientX+lastx*n)/(n+1);
      lasty=(e.clientY+lasty*n)/(n+1);
    }
    draw();
    canvas.addEventListener("mousemove",function(){mouse(event)});
    window.addEventListener("dblclick",function(){location.reload();});
    window.addEventListener("keyup",function(){
      keys[event.keyCode]=false;
    });
    window.addEventListener("keydown",function(){
      var e=event.keyCode;
      keys[e]=true;
      // console.log(k);
      switch (e) {
        case 32://space
          paused=!paused;
          console.log(paused?"Paused":"Unpaused");
          draw();
          break;
        case 37://left
          break;
        case 87://w
          movey+=0.05/zoom;
          break;
        case 65://a
          movex-=0.05/zoom;
          break;
        case 83://s
          movey-=0.05/zoom;
          break;
        case 68://d
          movex+=0.05/zoom;
          break;
        case 82://r
          restart();
          console.log("Restart");
          break;
        case 88://x
          controls=(controls+1)%3;
          console.log("Controls: "+controls);
          break;
        case 107://+
          zoom*=1.1;
          break;
        case 109://-
          zoom/=1.1;
          break;
        case 219://[
          thick/=1.1;
          break;
        case 221://]
          thick*=1.1;
          break;
      }
    });
    window.addEventListener("resize",function(){resize();})
  </script>

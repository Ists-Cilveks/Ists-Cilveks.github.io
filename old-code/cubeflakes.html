      function Vec2(x=0, y=0) {
        this.x=x;
        this.y=y;
        this.copy=function() {
          return new Vec2(this.x, this.y);
        }
        this.add=function(v1, v2) {// FIXME: doesn't always work with both values
          if (v2!=undefined) {
            return new Vec2(this.x+v1, this.y+v2);
          }
          return new Vec2(this.x+v1.x, this.y+v1.y);
        }
        this.sub=function(v) {
          return new Vec2(this.x-v.x, this.y-v.y);
        }
        this.mult=function(n) {
          return new Vec2(this.x*n, this.y*n);
        }
        this.div=function(n) {
          return new Vec2(this.x/n, this.y/n);
        }
        this.dot=function(v) {
          return v.x*this.x + v.y*this.y;
        }
        this.iHatLanding=function(v) {
          return new Vec2(v.x*this.x-v.y*this.y, v.x*this.y+v.y*this.x);
        }
        this.len=function() {
          return Math.sqrt(this.x**2+this.y**2);
        }
        this.sqLen=function() {
          return this.x**2+this.y**2;
        }
        this.dist=function(v) {
          return Math.sqrt((this.x-v.x)**2+(this.y-v.y)**2);
        }
        this.sqDist=function(v) {
          return (this.x-v.x)**2+(this.y-v.y)**2;
        }
        this.unit=function() {

        }

          let runningMinSqDist=Infinity

            let centralSymPoints=getPherPositiveSymPoints(p)

              let outerSymPoints=getPherSymPointArr(p)
              for (var curOuterSymPoint of outerSymPoints) {
                let curSqDist=curCentralSymPoint.sqDist(curOuterSymPoint.add(curOffset[0]))
                if (curSqDist<minFromNewPixels) minFromNewPixels=curSqDist
              }
            }
          }
          
          runningMinSqDist=minFromNewPixels
          
          for (var curOffset of pherOffsets) {//does the central flake's new point coincide with a stable point on an outer flake?
            // let centralSymPoints=getPherPositiveSymPoints(p)// TODO: Why would this have worked????
            let centralSymPoints=getPherSymPointArr(p)
            for (var curCentralSymPoint of centralSymPoints) {

            }

      function update() {//🔄 main loop, runs every frame
        if (!paused) {
          if (fReqsModFrameSkip>=frameSkip) {
            for (var i = 0; i < 1; i++) {
              let pos=evaluateNextDustPoint()
              if (pos) {
                drawDustPoint(pos)
              }
            }
            
            // drawForFrame();
            
            fReqs++;
            fReqsModFrameSkip-=frameSkip;
          }
          fReqsModFrameSkip++;
          if (!updateOnlyOnMouseMove) animationFrameRequest=window.requestAnimationFrame(update);
        }
        // else {//game is paused, show appropriate symbol
        //   drawPauseSymbol();
        // }
      }
      
      resize();
      function resizeWithWait() {//💠 call this in the resize event. on the event it sets a timer (minFramesSinceResize frames in length) after which it calls resize()
        if (framesSinceResize<minFramesSinceResize) {
          framesSinceResize++;
          window.requestAnimationFrame(resizeWithWait);
        }
        else {
          if (resizeRequested) {
            resize();
            resizeRequested=false;
          }
          framesSinceResize=0;
        }
      }
      function resize() {//💠 resize the canvas, change the grid sizing
        canvas.width=window.innerWidth;
        height=canvas.height=window.innerHeight;
        
        window.cancelAnimationFrame(animationFrameRequest);
        fReqsModFrameSkip=frameSkip;
        update();
      }
